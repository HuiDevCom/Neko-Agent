# 简体中文语言包（zh_cn）
# 占位符：
#   {0} {1} - 参数，按调用顺序填充
#   {server_name} - 服务器名称（config.yml 中配置）
#   {server_online} - 当前在线玩家数
#   {server_max} - 服务器最大玩家数
#   {version} - 插件版本
#   {agent_name}  - Agent 名字
prefix: "§b[{agent_name}]§r"
system_prefix: "[{agent_name}系统]"
error_prefix: "[{agent_name}]"
empty_welcome: "{0} 上线啦，欢迎来到{server_name}喵~"
fallback_join: "{0} 上线啦，欢迎来到{server_name}喵~"

